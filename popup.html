<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Privacy Guard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Privacy Guard</h2>

  <div class="row">
    <label>Enable:</label>
    <label class="switch">
      <input id="toggleEnabled" type="checkbox"/>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label>Hold time (seconds):</label>
    <input id="holdSeconds" type="number" min="1" step="1" />
  </div>

  <div class="row">
    <label>Min eye openness (0-1):</label>
    <input id="eyeOpenThreshold" type="number" min="0" max="1" step="0.05" />
  </div>

  <div class="row">
    <label>Max face angle (° from frontal):</label>
    <input id="maxYawDegrees" type="number" min="0" max="60" step="1" />
  </div>

  <div class="row">
    <label>Action:</label>
    <select id="actionMode">
      <option value="both">Blur + Popup</option>
      <option value="blur">Blur only</option>
      <option value="popup">Popup only</option>
    </select>
  </div>

  <button id="save">Save</button>
  <button id="test">Test Trigger</button>
  <script src="popup.js"></script>
</body>
</html>
